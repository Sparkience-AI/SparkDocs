[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sparkdocs"
version = "0.1.0"
description = "Local-first document ingestion and experimental grounded Q&A."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Nitin Sagar" }]
dependencies = [
  "fastembed>=0.8,<1",
  "langchain-core>=0.2.28,<2",
  "langchain-google-genai>=1.0.8,<4",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "streamlit>=1.37,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sparkdocs"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "skip"
ignore_missing_imports = true
