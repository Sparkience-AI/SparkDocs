name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    uses: Sparkience-AI/.github/.github/workflows/reusable-python-quality.yml@adc5b60771b32fbf93f28304fbcf2dd5ad4a0464
    with:
      python-version: "3.12"
      run-type-check: true

  docs:
    uses: Sparkience-AI/.github/.github/workflows/reusable-docs-geo.yml@adc5b60771b32fbf93f28304fbcf2dd5ad4a0464

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate MCP extra and contracts
        run: |
          uv sync --locked --all-groups --extra mcp
          uv run --locked --extra mcp pytest -q
      - name: Build distributions
        run: uv build --no-sources
      - name: Generate release evidence
        if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/release_evidence.py --dist dist --output release-evidence --source-commit "$GITHUB_SHA"
      - name: Smoke-test installed wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .wheel-smoke/bin/python -c "import sparkdocs"

  windows-mcp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Validate bounded MCP discovery and cleanup
        run: |
          uv sync --locked --all-groups --extra mcp
          uv run --locked --extra mcp pytest tests/test_mcp_server.py -q
